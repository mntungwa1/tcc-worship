<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#18243a;background:transparent}.card{border:1px solid #d3d9e2;border-radius:12px;padding:18px;background:#fff}label{display:block;font-weight:600;margin:8px 0}input,select{width:100%;padding:11px;border:1px solid #bcc6d4;border-radius:7px;font:inherit;background:#fff;color:#18243a}button{padding:10px 14px;margin:5px 5px 5px 0;border:1px solid #b6c2d1;border-radius:7px;background:#f1f4f8;color:#18243a;font:inherit;cursor:pointer}.primary{background:#e8bc73;border-color:#d2a451}button:disabled{opacity:.45;cursor:default}.actions{display:flex;flex-wrap:wrap;gap:3px}.muted{font-size:13px;color:#526175}#message{white-space:pre-wrap;margin:12px 0}#message.error{color:#a51616}#message.success{color:#176537}hr{border:0;border-top:1px solid #e0e5ec;margin:18px 0}h3{margin:0 0 10px;font-size:18px}
</style></head><body><div class="card"><h3>Save your service</h3><label for="name">Saved service / song-list name</label><input id="name" maxlength="150" placeholder="Sunday morning service">
<p class="muted" id="active">Your song list, slides and background are saved together.</p><div class="actions"><button id="save" class="primary">Save</button><button id="download-current">Download a copy</button></div><p class="muted">Use a new name to keep a separate service.</p>
<hr><label for="saved">Saved preparations</label><select id="saved"><option value="">No saved preparations yet</option></select><p class="muted" id="details"></p><button id="open" class="primary">Open</button><div id="message" role="status" aria-live="polite"></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
let args={},database=null,metadata=[],lastActive=undefined,busy=false;
const post=data=>parent.postMessage({isStreamlitMessage:true,...data},'*');
const height=()=>post({type:'streamlit:setFrameHeight',height:document.body.scrollHeight+12});
function message(text,error=false){$('message').textContent=text;$('message').className=error?'error':'success';height();}
function signal(action,data={}){post({type:'streamlit:setComponentValue',value:{action,event:crypto.randomUUID(),...data},dataType:'json'});}
function openDB(){return new Promise((resolve,reject)=>{const request=indexedDB.open('tcc-worship-saved-services',1);request.onupgradeneeded=()=>{const db=request.result;db.createObjectStore('projects',{keyPath:'id'});db.createObjectStore('summary',{keyPath:'id'});};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});}
function read(store,id){return new Promise((resolve,reject)=>{const tx=database.transaction(store,'readonly');const request=id===undefined?tx.objectStore(store).getAll():tx.objectStore(store).get(id);request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});}
function saveRecord(record,expected){return new Promise((resolve,reject)=>{const tx=database.transaction(['projects','summary'],'readwrite');let conflict=false;const store=tx.objectStore('projects');const request=store.get(record.id);request.onsuccess=()=>{const old=request.result;if(expected!==null&&(!old||old.revision!==expected)){conflict=true;tx.abort();return;}store.put(record);tx.objectStore('summary').put({id:record.id,name:record.name,kind:record.project.kind,updated_at:record.updated_at,revision:record.revision,items:record.project.workspace.service.length});};tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(Error(conflict?'This save was updated in another tab. Open the saved preparation again before updating.':'The browser could not store this preparation. Download it as a service file.'));});}
function buttons(){const ready=!!args.project&&!busy;for(const id of ['save','download-current'])$(id).disabled=!ready;$('open').disabled=busy||!$('saved').value;}
function details(){const row=metadata.find(x=>x.id===$('saved').value);$('details').textContent=row?(row.kind==='songlist'?'Song list':'Prepared presentation')+' · '+row.items+' items · saved '+new Date(row.updated_at).toLocaleString():'';buttons();height();}
async function refresh(selected){if(!database)return;metadata=(await read('summary')).sort((a,b)=>b.updated_at.localeCompare(a.updated_at));$('saved').replaceChildren();if(!metadata.length){const option=document.createElement('option');option.value='';option.textContent='No saved preparations yet';$('saved').append(option);}for(const row of metadata){const option=document.createElement('option');option.value=row.id;option.textContent=row.name+(row.kind==='songlist'?' — Song list':' — Presentation');$('saved').append(option);}if(selected&&metadata.some(x=>x.id===selected))$('saved').value=selected;details();}
async function capture(){
 const project=structuredClone(args.project);if(!project)throw Error('Prepare a service or song list first.');
 const snapshot=await new Promise(resolve=>{let channel;try{channel=new BroadcastChannel('tcc-worship-output-'+args.session+'-v2');}catch(_){resolve(null);return;}const request=crypto.randomUUID();const timer=setTimeout(()=>{channel.close();resolve(null);},500);channel.onmessage=event=>{const data=event.data;if(data.type==='service-snapshot'&&data.to===request){clearTimeout(timer);channel.close();resolve(data.workspace);}};channel.postMessage({type:'capture-service',session:args.session,from:request});});
 if(snapshot){project.workspace.service=snapshot.service;project.workspace.theme=snapshot.theme;project.workspace.service_title=snapshot.service_title;project.bibles=snapshot.bibles;}
 if(project.kind==='songlist'){project.workspace.service=project.workspace.service.filter(x=>x.kind==='song');project.workspace.library=structuredClone(project.workspace.service);if(!project.workspace.service.length)throw Error('Add songs to Service planner before saving a song list.');}
 const size=new TextEncoder().encode(JSON.stringify(project)).length;if(size>128*1024*1024)throw Error('This preparation exceeds the 128 MB service-file limit. Use smaller media.');return project;
}
async function download(project,name){const raw=new TextEncoder().encode(JSON.stringify(project));let blob=new Blob([raw],{type:'application/json'});if(typeof CompressionStream!=='undefined')blob=await new Response(blob.stream().pipeThrough(new CompressionStream('gzip'))).blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=(name||'TCC Worship Service').replace(/[^a-zA-Z0-9 _-]/g,'_')+'.tccworship';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
async function saving(){busy=true;buttons();try{if(!database)throw Error('Browser storage is unavailable. Use Download a copy.');const name=$('name').value.trim();if(!name)throw Error('Enter a name for this preparation.');const project=await capture();const updating=!!args.active_id&&name===args.active_name;const id=updating?args.active_id:crypto.randomUUID();const revision=updating?(args.active_revision||0)+1:1;const record={id,name,revision,updated_at:new Date().toISOString(),project};await saveRecord(record,updating?args.active_revision:null);args.active_id=id;args.active_name=name;args.active_revision=revision;lastActive=id;await refresh(id);$('active').textContent='Current saved preparation: '+name;message('Saved '+name+'.');signal('saved',{id,name,revision});}catch(error){message(error.message,true);}finally{busy=false;buttons();}}
$('save').onclick=saving;$('saved').onchange=details;
$('open').onclick=async()=>{try{const record=await read('projects',$('saved').value);if(!record)throw Error('Saved preparation not found.');message('Opening '+record.name+'…');signal('open',{id:record.id,name:record.name,revision:record.revision,project:record.project});}catch(error){message(error.message,true);}};
$('download-current').onclick=async()=>{try{await download(await capture(),$('name').value||'TCC Worship Service');message('Downloaded the prepared service file.');}catch(error){message(error.message,true);}};
window.addEventListener('message',async event=>{if(event.data.type!=='streamlit:render')return;args=event.data.args||{};if(lastActive!==args.active_id){lastActive=args.active_id;$('name').value=args.active_name||'Sunday service';}$('active').textContent=args.active_id?'Current saved preparation: '+args.active_name:'Your song list, slides and background are saved together.';try{if(!database)database=await openDB();await refresh(args.active_id);}catch(error){message('Browser storage is unavailable. Use Download a copy to keep your preparation.',true);}buttons();height();});
post({type:'streamlit:componentReady',apiVersion:1});height();
</script></body></html>
